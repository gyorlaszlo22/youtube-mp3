<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reklámmentes MP3 Letöltő</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #e0e0e0; padding: 20px; text-align: center; margin: 0; }
        .container { max-width: 400px; margin: 60px auto; background: #1e1e1e; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color: #fff; margin-bottom: 8px; font-size: 22px; }
        p { color: #888; font-size: 13px; margin-bottom: 24px; }
        input { width: 100%; padding: 14px; margin-bottom: 16px; border-radius: 10px; border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 15px; box-sizing: border-box; }
        input:focus { border-color: #4CAF50; outline: none; }
        button { background: #4CAF50; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 10px; cursor: pointer; width: 100%; transition: background 0.2s; }
        button:hover { background: #43a047; }
        #status { margin-top: 20px; font-size: 14px; color: #81c784; line-height: 1.5; }
        .spinner { display: none; width: 24px; height: 24px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s ease-in-out infinite; margin: 15px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h2>MP3 Letöltő</h2>
        <p>Tiszta, reklámmentes felület</p>
        <input type="text" id="urlInput" placeholder="Illeszd be a YouTube linket...">
        <button onclick="startDownload()">Letöltés indítása</button>
        <div class="spinner" id="loadingSpinner"></div>
        <div id="status"></div>
    </div>

    <script>
        function startDownload() {
            const url = document.getElementById('urlInput').value.trim();
            const statusDiv = document.getElementById('status');
            const spinner = document.getElementById('loadingSpinner');
            
            if(!url) {
                alert('Kérlek adj meg egy linket!');
                return;
            }

            statusDiv.innerHTML = "";
            spinner.style.display = "block";

            // Szimulált tiszta visszajelzés, amíg az APK-ba csomagolt WebView feldolgozza
            setTimeout(() => {
                spinner.style.display = "none";
                statusDiv.innerHTML = `
                    <b>A feldolgozás sikeres!</b><br>
                    <span style="color: #aaa; font-size: 12px;">Ez a felület teljesen mentes a felugró reklámoktól.</span>
                `;
            }, 1500);
        }
    </script>
</body>
</html>
