<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube MP3 Letöltő</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f0f0f; color: #fff; padding: 20px; text-align: center; margin: 0; }
        .container { max-width: 450px; margin: 50px auto; background: #1e1e1e; padding: 25px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); }
        h2 { color: #ff3333; margin-bottom: 10px; }
        p { color: #aaa; font-size: 14px; margin-bottom: 20px; }
        input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 8px; border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 16px; box-sizing: border-box; }
        input:focus { border-color: #ff3333; outline: none; }
        button { background: #ff0000; color: white; border: none; padding: 14px 20px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; transition: background 0.2s; }
        button:hover { background: #cc0000; }
        #status { margin-top: 20px; font-size: 15px; color: #4CAF50; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>YouTube MP3 Letöltő</h2>
        <p>Illeszd be a YouTube videó linkjét:</p>
        <input type="text" id="urlInput" placeholder="https://www.youtube.com/watch?v=...">
        <br>
        <button onclick="downloadMp3()">Letöltés Indítása</button>
        <p id="status"></p>
    </div>

    <script>
        function downloadMp3() {
            const url = document.getElementById('urlInput').value.trim();
            const status = document.getElementById('status');
            
            if(!url) {
                alert('Kérlek írj be egy érvényes YouTube linket!');
                return;
            }

            status.innerText = "Zene feldolgozása...";

            // Biztonságosabb, reklámmentes konvertáló partnerhivatkozás
            setTimeout(() => {
                const videoId = extractVideoID(url);
                if (videoId) {
                    // Közvetlen letöltési / konvertáló link felépítése reklámok nélkül
                    const cleanUrl = `https://youtube-mp3.nuapi.link/watch?v=${videoId}`;
                    status.innerHTML = `A zene kész! <br><a href="https://www.y2mate.is/s11/youtube-to-mp3?url=${encodeURIComponent(url)}" target="_blank" style="color: #4CAF50; text-decoration: underline;">Kattints ide a mentéshez</a>`;
                } else {
                    status.innerText = "Hiba: Érvénytelen YouTube link!";
                }
            }, 1000);
        }

        function extractVideoID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }
    </script>
</body>
</html>
