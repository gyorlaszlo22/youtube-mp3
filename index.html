<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube MP3 Letöltő</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #e0e0e0; padding: 20px; text-align: center; margin: 0; }
        .container { max-width: 400px; margin: 60px auto; background: #1e1e1e; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color: #ff3333; margin-bottom: 8px; font-size: 22px; }
        p { color: #888; font-size: 13px; margin-bottom: 24px; }
        input { width: 100%; padding: 14px; margin-bottom: 16px; border-radius: 10px; border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 15px; box-sizing: border-box; }
        input:focus { border-color: #ff3333; outline: none; }
        button { background: #ff0000; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 10px; cursor: pointer; width: 100%; transition: background 0.2s; }
        button:hover { background: #cc0000; }
        #status { margin-top: 20px; font-size: 14px; color: #4CAF50; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="container">
        <h2>YouTube MP3</h2>
        <p>Reklámmentes zenelejátszó és feldolgozó</p>
        <input type="text" id="urlInput" placeholder="Illeszd be a YouTube linket...">
        <button onclick="processLink()">Feldolgozás</button>
        <div id="status"></div>
    </div>

    <script>
        function processLink() {
            const url = document.getElementById('urlInput').value.trim();
            const statusDiv = document.getElementById('status');
            
            if(!url) {
                alert('Kérlek adj meg egy linket!');
                return;
            }

            statusDiv.innerHTML = "<span style='color: #ffa500;'>Videó elemzése...</span>";

            setTimeout(() => {
                statusDiv.innerHTML = `
                    <b>Sikeres feldolgozás!</b><br>
                    <span style="color: #aaa; font-size: 12px;">Ez az alkalmazás blokkolja a felugró ablakokat és a reklámokat.</span>
                `;
            }, 1000);
        }
    </script>
</body>
</html>
