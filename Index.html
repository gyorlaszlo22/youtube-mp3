<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube MP3 Letöltő</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f0f0f; color: #fff; padding: 20px; text-align: center; margin: 0; }
        .container { max-width: 450px; margin: 50px auto; background: #1e1e1e; padding: 25px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); }
        h2 { color: #ff3333; margin-bottom: 10px; }
        p { color: #aaa; font-size: 14px; margin-bottom: 20px; }
        input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 8px; border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 16px; box-sizing: border-box; }
        input:focus { border-color: #ff3333; outline: none; }
        button { background: #ff0000; color: white; border: none; padding: 14px 20px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; transition: background 0.2s; }
        button:hover { background: #cc0000; }
        #resultArea { margin-top: 20px; word-break: break-all; }
        .link-btn { display: inline-block; margin-top: 15px; background: #28a745; color: white; padding: 12px 20px; text-decoration: none; border-radius: 8px; font-weight: bold; width: 100%; box-sizing: border-box; }
        .link-btn:hover { background: #218838; }
    </style>
</head>
<body>
    <div class="container">
        <h2>YouTube MP3 Letöltő</h2>
        <p>Illeszd be a YouTube zene vagy lejátszási lista linkjét:</p>
        <input type="text" id="urlInput" placeholder="https://www.youtube.com/watch?v=...">
        <br>
        <button onclick="convertVideo()">Letöltés Előkészítése</button>
        <div id="resultArea"></div>
    </div>

    <script>
        function convertVideo() {
            const url = document.getElementById('urlInput').value.trim();
            const resultArea = document.getElementById('resultArea');
            
            if(!url) {
                alert('Kérlek írj be egy érvényes YouTube linket!');
                return;
            }

            resultArea.innerHTML = "<p style='color: #ffa500;'>Link elemzése és konvertálás indítása...</p>";

            // Itt egy ingyenes, megbízható webes konvertáló API-t hívunk meg, 
            // ami azonnal átváltja a linket letölthető MP3-má mobilon is.
            setTimeout(() => {
                // Biztonságos kódolás a linkhez
                const encodedUrl = encodeURIComponent(url);
                
                resultArea.innerHTML = `
                    <p style="color: #4CAF50; font-weight: bold;">A konvertálás kész!</p>
                    <a class="link-btn" href="https://loader.to/api/button/?url=${encodedUrl}&f=mp3" target="_blank">
                        Letöltés MP3 Formátumban
                    </a>
                `;
            }, 1000);
        }
    </script>
</body>
</html>
